# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to the root build.gradle expandProps map.

# Project
java_version=21
enabled_platforms=forge,fabric,neoforge

# Mod options
mod_author=Yanny
license=MIT
# ALI
ali_mod_name=AdvancedLootInfo
ali_mod_id=ali
ali_version=2.2.0
ali_group=com.yanny.ali
ali_description=EMI/JEI/REI plugin for displaying advanced information about loot tables and trades
ali_modrinth_project_id=PEPVViac
ali_curseforge_project_id=1205426
# AWI
awi_mod_name=AdvancedWorldgenInfo
awi_mod_id=awi
awi_version=1.1.1
awi_group=com.yanny.awi
awi_description=EMI/JEI/REI plugin for displaying advanced information about worldgen
awi_modrinth_project_id=Ru0LLQdN
awi_curseforge_project_id=1661937
# ACI
aci_mod_name=AdvancedCoreInfo
aci_mod_id=aci
aci_version=1.2.0
aci_group=com.yanny.aci
aci_description=Shared core library for AdvancedLootInfo and AdvancedWorldgenInfo
aci_modrinth_project_id=BaR4ijFC
aci_curseforge_project_id=1661923
aci_version_range=[1.2,)
aci_version_range_fabric=>=1.2
# ALICompat
