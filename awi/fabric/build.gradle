plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    gametest {
        java.srcDir project(":aci:common").file("src/gametest/java")
        resources.srcDir project(":aci:common").file("src/gametest/resources")
        java.srcDir project(":awi:common").file("src/gametest/java")
        resources.srcDir project(":awi:common").file("src/gametest/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = project(":awi:common").loom.accessWidenerPath
    createRemapConfigurations(sourceSets.gametest)

    runs {
        datagen {
            inherit client
            name "Minecraft Data"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":awi:fabric").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${awi_mod_id}"

            runDir "build/datagen"
        }
        gametest {
            server()
            name "Minecraft GameTest"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.file("build/gametest/report.xml")}"
            vmArg "-Dawi.golden.dir=${project.file("src/gametest/golden")}"
            vmArg "-Dawi.golden.actual=${project.file("build/gametest/golden")}"
            vmArg "-Dawi.golden.regenerate=${project.findProperty("awi_golden_regenerate") ?: false}"

            runDir "build/gametest/run"
        }
    }
}

tasks.matching { it.name == "runGametest" }.configureEach {
    timeout = java.time.Duration.ofMinutes(10)

    doFirst {
        delete "build/gametest/run/config"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    common(project(path: ":aci:common", configuration: "namedElements")) { transitive false }
    runtimeOnly project(path: ":aci:fabric", configuration: "namedElements")

    project.ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: p, configuration: "transformProductionFabric")) { transitive false }
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":awi:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}