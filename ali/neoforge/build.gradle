plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    gametest {
        java.srcDir project(":aci:common").file("src/gametest/java")
        resources.srcDir project(":aci:common").file("src/gametest/resources")
        java.srcDir project(":ali:common").file("src/gametest/java")
        resources.srcDir project(":ali:common").file("src/gametest/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = project(":ali:common").loom.accessWidenerPath
    createRemapConfigurations(sourceSets.gametest)

    neoForge {
        convertAccessWideners(tasks.named("remapJar"), "ali.accesswidener")
    }

    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "ali.neoforge.refmap.json"
    }

    runs {
        data {
            clientData()
            programArgs "--all", "--mod", "${ali_mod_id}"
            programArgs "--output", "${file('src/main/generated/')}"
            programArgs "--existing", "${file("src/main/resources").absolutePath}"
        }
        gametest {
            environment "gametestserver"
            forgeTemplate "gameTestServer"
            name "Minecraft GameTest"
            source sourceSets.gametest
            property "neoforge.enabledGameTestNamespaces", ali_mod_id
            property "ali.golden.dir", project.file("src/gametest/golden").absolutePath
            property "ali.golden.actual", project.file("build/gametest/golden").absolutePath
            property "ali.golden.regenerate", (project.findProperty("ali_golden_regenerate") ?: "false").toString()
            programArgs "--mixin.config", "aci.gametest.mixins.json"

            runDir "build/gametest/run"

            mods {
                main {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gametest
                }
            }
        }
    }
}

tasks.matching { it.name == "runGametest" }.configureEach {
    timeout = java.time.Duration.ofMinutes(10)

    doFirst {
        delete "build/gametest/run/config", "build/gametest/run/kubejs", "build/gametest/run/mods"
        copy {
            from project(":ali:common").file("src/gametest/kubejs")
            into "build/gametest/run/kubejs"
        }
        copy {
            from { extractKubeJsNestedLibs() }
            into "build/gametest/run/mods"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    common(project(path: ":aci:common", configuration: "namedElements")) { transitive false }
    runtimeOnly project(path: ":aci:neoforge", configuration: "namedElements")

    project.ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: p, configuration: "transformProductionNeoForge")) { transitive false }
    }

    // LootJS
    modCompileOnly "curse.maven:kubejs-238086:7103315"
    modCompileOnly "curse.maven:rhino-416294:7104526"
    modCompileOnly "curse.maven:lootjs-570630:8009262"

    modGametestRuntimeOnly "curse.maven:kubejs-238086:7103315"
    modGametestRuntimeOnly "curse.maven:rhino-416294:7104526"
    modGametestRuntimeOnly "curse.maven:lootjs-570630:8009262"
}

// a NeoForge dev launch does not unpack jar-in-jar; a nested library needs FMLModType: GAMELIBRARY to load from mods/
def extractKubeJsNestedLibs() {
    def kubejs = configurations.detachedConfiguration(dependencies.create("curse.maven:kubejs-238086:7103315")).tap { transitive = false }.files.first()
    def nestedDir = file("build/gametest/nested/kubejs")
    def outer = new java.util.zip.ZipFile(kubejs)

    nestedDir.deleteDir()
    nestedDir.mkdirs()

    outer.entries().findAll { it.name ==~ /META-INF\/jarjar\/[^\/]+\.jar/ }.each { nested ->
        def name = nested.name.substring(nested.name.lastIndexOf("/") + 1)
        def input = new java.util.jar.JarInputStream(new ByteArrayInputStream(outer.getInputStream(nested).readAllBytes()))
        def entries = [:]

        for (def entry = input.nextJarEntry; entry != null; entry = input.nextJarEntry) {
            entries[entry.name] = input.readAllBytes()
        }
        input.close()

        def manifest = input.manifest ?: new java.util.jar.Manifest()
        manifest.mainAttributes.putValue("Manifest-Version", "1.0")
        manifest.mainAttributes.putValue("FMLModType", "GAMELIBRARY")

        def output = new java.util.jar.JarOutputStream(new FileOutputStream(new File(nestedDir, name)), manifest)
        entries.each { entryName, data ->
            output.putNextEntry(new java.util.jar.JarEntry(entryName))
            output.write(data)
            output.closeEntry()
        }
        output.close()
    }

    outer.close()
    return fileTree(nestedDir).files
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":ali:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}