architectury {
    common(enabled_platforms.split(","))
}

loom {
    accessWidenerPath = project(":ali:common").loom.accessWidenerPath

}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    implementation "net.neoforged:neoforge:${neoforge_version}"

    compileOnly project(path: ":ali:common")
    compileOnly project(path: ":aci:common")

    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'

    compileOnly "curse.maven:kubejs-238086:8495199"
    compileOnly "curse.maven:rhino-416294:8218748"
    compileOnly "curse.maven:lootjs-570630:8569378"

    testImplementation 'org.junit.platform:junit-platform-suite:1.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.21.0'

    testImplementation project(path: ":aci:common")
    testImplementation project(path: ":aci:common", configuration: "testArtifacts")
    testImplementation project(path: ":ali:common")
    testImplementation project(path: ":ali:common", configuration: "testArtifacts")
}

configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom compileClasspath
}

test {
    useJUnitPlatform()
}
