plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":ali:common").loom.accessWidenerPath

    runs {
        datagen {
            inherit client
            name "Minecraft Data"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${project(":alicompat:fabric").file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${alicompat_mod_id}"

            runDir "build/datagen"
        }
    }
}

evaluationDependsOn(":ali:fabric")

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    common(project(path: ":aci:common", configuration: "namedElements")) { transitive false }
    common(project(path: ":ali:common", configuration: "namedElements")) { transitive false }
    runtimeOnly project(path: ":aci:fabric", configuration: "namedElements")
    runtimeOnly project(path: ":ali:fabric", configuration: "namedElements")
    rootProject.project(":ali:fabric").ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
    }

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    project.ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: p, configuration: "transformProductionFabric")) { transitive false }
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":alicompat:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
