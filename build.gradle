plugins {
    id "architectury-plugin" version "3.5.169"
    id "dev.architectury.loom" version "1.17.491" apply false
    id "com.gradleup.shadow" version "8.3.6" apply false
    id "lol.bai.explosion" version "0.3.1" apply false
}

architectury {
    minecraft = minecraft_version
}

def platforms = enabled_platforms.split(",")
def viewers = ["emi", "jei", "rei"]

subprojects {
    if (project.name == "processor") {
        return
    }

    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        annotationProcessor project(":processor")
    }

    ext {
        expandProps = [
                "mod_author"                   : mod_author,
                "license"                      : license,

                "ali_mod_name"                 : ali_mod_name,
                "ali_mod_id"                   : ali_mod_id,
                "ali_version"                  : ali_version,
                "ali_group"                    : ali_group,
                "ali_description"              : ali_description,

                "awi_mod_name"                 : awi_mod_name,
                "awi_mod_id"                   : awi_mod_id,
                "awi_version"                  : awi_version,
                "awi_group"                    : awi_group,
                "awi_description"              : awi_description,

                "aci_mod_name"                 : aci_mod_name,
                "aci_mod_id"                   : aci_mod_id,
                "aci_version"                  : aci_version,
                "aci_group"                    : aci_group,
                "aci_description"              : aci_description,
                "aci_version_range"            : aci_version_range,
                "aci_version_range_fabric"     : aci_version_range_fabric,

                "alicompat_mod_name"           : alicompat_mod_name,
                "alicompat_mod_id"             : alicompat_mod_id,
                "alicompat_version"            : alicompat_version,
                "alicompat_group"              : alicompat_group,
                "alicompat_description"        : alicompat_description,
                "alicompat_ali_version_range"  : alicompat_ali_version_range,
                "alicompat_ali_version_range_fabric": alicompat_ali_version_range_fabric,

                "java_version"                 : java_version,

                "minecraft_version"            : minecraft_version,
                "minecraft_version_range"      : minecraft_version_range,

                "forge_version"                : forge_version,
                "forge_loader_version_range"   : forge_loader_version_range,
                "forge_version_range"          : forge_version_range,

                "neoforge_version"             : neoforge_version,
                "neoforge_loader_version_range": neoforge_loader_version_range,
                "neoforge_version_range"       : neoforge_version_range,

                "fabric_version"               : fabric_version,
                "fabric_loader_version"        : fabric_loader_version,

                "emi_version"                  : emi_version,
                "emi_version_range"            : emi_version_range,
                "emi_version_range_fabric"     : emi_version_range_fabric,

                "jei_version"                  : jei_version,
                "jei_version_range"            : jei_version_range,
                "jei_version_range_fabric"     : jei_version_range_fabric,

                "rei_version"                  : rei_version,
                "rei_version_range"            : rei_version_range,
                "rei_version_range_fabric"     : rei_version_range_fabric,
                "cloth_config_version"         : cloth_config_version,
                "architectury_version"         : architectury_version
        ]
    }

    if (platforms.contains(project.name)) {
        def emi_available = emi_enabled == "true" && project.findProperty("${project.name}_emi_enabled") == "true"
        def jei_available = jei_enabled == "true" && project.findProperty("${project.name}_jei_enabled") == "true"
        def rei_available = rei_enabled == "true" && project.findProperty("${project.name}_rei_enabled") == "true"
        def lootjs_available = lootjs_enabled == "true" && project.findProperty("${project.name}_lootjs_enabled") == "true"
        def isAci = project.parent.name == "aci"
        def isAliCompat = project.parent.name == "alicompat"

        ext {
            commonProjects = []
        }

        if (isAci) {
            project.ext.commonProjects << ":aci:common"
        } else if (project.parent.name == "ali") {
            project.ext.commonProjects << ":ali:common"

            if (emi_available) project.ext.commonProjects << ":ali:common-emi"
            if (jei_available) project.ext.commonProjects << ":ali:common-jei"
            if (rei_available) project.ext.commonProjects << ":ali:common-rei"
            if (lootjs_available) project.ext.commonProjects << ":ali:common-lootjs"

            loom {
                runs {
                    client {
                        client()
                        ideConfigGenerated = true
                        name = "Run ALI Client"
                        source(sourceSets.main)
                    }
                }
            }
        } else if (project.parent.name == "awi") {
            project.ext.commonProjects << ":awi:common"

            if (emi_available) project.ext.commonProjects << ":awi:common-emi"
            if (jei_available) project.ext.commonProjects << ":awi:common-jei"
            if (rei_available) project.ext.commonProjects << ":awi:common-rei"
        } else if (isAliCompat) {
            project.ext.commonProjects << ":alicompat:common"

            // Fabric target mods bundle their libraries as jar-in-jar, which a dev launch does not unpack
            if (project.name == "fabric") {
                apply plugin: "lol.bai.explosion"
            }

            def compatMods = (project.findProperty("compat_mods") ?: "").split(",").findAll { it }

            // ServiceLoader reads one file per name, so the per-mod fragments have to be merged
            def generateCompatServices = tasks.register("generateCompatServices") {
                def serviceDirs = compatMods.collect { file("src/compat/$it/services") }.findAll { it.isDirectory() }
                def outDir = layout.buildDirectory.dir("generated/compat-resources").get().asFile

                inputs.files(serviceDirs)
                outputs.dir(outDir)

                doLast {
                    def fragments = [:].withDefault { [] }

                    serviceDirs.each { dir ->
                        dir.listFiles({ f -> f.isFile() } as FileFilter).each { fragments[it.name] << it.text.trim() }
                    }

                    outDir.deleteDir()

                    fragments.each { name, texts ->
                        def content = texts.findAll { it }.join("\n")

                        if (!content.isEmpty()) {
                            def target = new File(outDir, "META-INF/services/$name")

                            target.parentFile.mkdirs()
                            target.text = content
                        }
                    }
                }
            }

            sourceSets.main {
                java.srcDirs += compatMods.collect { "src/compat/$it/java" }
                resources.srcDirs += compatMods.collect { "src/compat/$it/resources" }
                resources.srcDir generateCompatServices
            }

            dependencies {
                compatMods.each { mod ->
                    def dep = project.findProperty("${mod}_${project.name}_dep")

                    // compile-only on purpose: a target mod on the run classpath drags its own datagen entrypoint into ours
                    if (dep) {
                        modCompileOnly project.name == "fabric" ? project.explosion.fabric(dep) : dep
                    }
                }
            }

            loom {
                runs {
                    client {
                        client()
                        ideConfigGenerated = true
                        name = "Run ALICompat Client"
                        source(sourceSets.main)
                    }
                }
            }
        }

        if (!isAci && !isAliCompat) {
            // register tasks that allow running specific combination of recipe viewer and launcher
            viewers.each { viewer ->
                if (project.findProperty("${viewer}_enabled") == "true" && project.findProperty("${project.name}_${viewer}_enabled") == "true") {
                    tasks.register("run${project.parent.name.capitalize()}${project.name.capitalize()}${viewer.capitalize()}Client", GradleBuild) {
                        group = "launchers"
                        description = "Launch ${project.parent.name.capitalize()} ${project.name.toUpperCase()} with ${viewer.toUpperCase()} recipe viewer"
                        setTasks([":${project.parent.name}:${project.name}:runClient".toString()])
                        startParameter.projectProperties = ["recipe_viewer": viewer]
                    }
                }
            }

            // recipe viewer stays off the datagen classpath: EMI's client mixins fail injection during Forge datagen
            tasks.register("run${project.parent.name.capitalize()}${project.name.capitalize()}Datagen", GradleBuild) {
                group = "launchers"
                description = "Generate ${project.parent.name.capitalize()} ${project.name.toUpperCase()} data"
                setTasks([":${project.parent.name}:${project.name}:runData".toString()])
                startParameter.projectProperties = ["recipe_viewer": "none"]
            }

            dependencies {
                def recipe_viewer = project.findProperty("recipe_viewer")
                if (!recipe_viewer) {
                    if (emi_available) recipe_viewer = "emi"
                    else if (jei_available) recipe_viewer = "jei"
                    else if (rei_available) recipe_viewer = "rei"
                }

                if (emi_available) {
                    modCompileOnlyApi "dev.emi:emi-${project.name}:${emi_version}"

                    if (recipe_viewer == "emi") {
                        modRuntimeOnly "dev.emi:emi-${project.name}:${emi_version}"
                    }
                }
                if (jei_available && recipe_viewer == "jei") {
                    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-${project.name}:${jei_version}"
                }
                if (rei_available) {
                    modCompileOnlyApi "me.shedaniel:RoughlyEnoughItems-api-${project.name}:${rei_version}"

                    if (recipe_viewer == "rei") {
                        modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-${project.name}:${rei_version}"

                        if (project.name == "forge") {
                            modRuntimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
                            modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"
                        }
                    }
                }
            }
        }

        processResources {
            if (project.parent.name == "ali") {
                from(project(":ali:common").sourceSets.main.resources.srcDirs) {
                    include "pack.mcmeta"
                    include "ali.accesswidener"
                }
            } else if (project.parent.name == "awi") {
                from(project(":awi:common").sourceSets.main.resources.srcDirs) {
                    include "pack.mcmeta"
                    include "awi.accesswidener"
                }
            } else if (project.parent.name == "aci") {
                from(project(":aci:common").sourceSets.main.resources.srcDirs) {
                    include "pack.mcmeta"
                }
            } else if (project.parent.name == "alicompat") {
                from(project(":alicompat:common").sourceSets.main.resources.srcDirs) {
                    include "pack.mcmeta"
                }
            }

            inputs.property "version", project.version

            filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
                expand project.ext.expandProps
            }
        }

        sourceSets {
            main {
                resources {
                    srcDir "src/main/generated"
                    exclude ".cache/**"
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    if (project.parent) {
        if (project.parent.name == "ali") {
            base {
                archivesName = "${ali_mod_name}-${project.name}"
            }

            version = minecraft_version + "-" + ali_version
            group = ali_group
        } else if (project.parent.name == "awi") {
            base {
                archivesName = "${awi_mod_name}-${project.name}"
            }

            version = minecraft_version + "-" + awi_version
            group = awi_group
        } else if (project.parent.name == "aci") {
            base {
                archivesName = "${aci_mod_name}-${project.name}"
            }

            version = minecraft_version + "-" + aci_version
            group = aci_group
        } else if (project.parent.name == "alicompat") {
            base {
                archivesName = "${alicompat_mod_name}-${project.name}"
            }

            version = minecraft_version + "-" + alicompat_version
            group = alicompat_group
        }
    }

    repositories {
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven { // EMI
            name = "EMI"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "JEI"
            url "https://maven.blamejared.com"
        }
        maven {
            name = "REI"
            url "https://maven.shedaniel.me"
        }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven { // ALICompat's explosion plugin resolves its jar-in-jar helper as a normal dependency
            url "https://maven2.bai.lol"
            content {
                includeGroup "lol.bai.explosion"
            }
        }
        maven { // KubeJS
            // Shedaniel's maven (Architectury API)
            url = "https://maven.architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }
        maven { // KubeJS
            // saps.dev Maven (KubeJS and Rhino)
            url = "https://maven.saps.dev/minecraft"
            content {
                includeGroup "dev.latvian.mods"
            }
        }
        maven { // CurseForge
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set(java_version as Integer)
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version)
        withSourcesJar()
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

def uploadTargets = [
        all       : ["suffix": "", "label": "Modrinth and CurseForge"],
        modrinth  : ["suffix": "Modrinth", "label": "Modrinth"],
        curseforge: ["suffix": "Curseforge", "label": "CurseForge"],
]

def uploadRunConfigTasks = ["ali", "awi", "aci"].collectMany { modId ->
    uploadTargets.collect { target, targetInfo ->
        tasks.register("generateUploadRunConfig${modId.capitalize()}${targetInfo.suffix}") {
            group = "ide"
            description = "Writes an IntelliJ Python run configuration that uploads ${project.property("${modId}_mod_name")} to ${targetInfo.label}"

            def modName = project.property("${modId}_mod_name")
            def parameters = [
                    "--mod-id=${modId}",
                    "--modrinth-project-id=${project.property("${modId}_modrinth_project_id")}",
                    "--curseforge-project-id=${project.property("${modId}_curseforge_project_id")}",
                    "--release-type=beta",
                    "--target=${target}",
            ].join(" ")
            def configName = "Upload ${modId.toUpperCase()}${targetInfo.suffix.isEmpty() ? "" : " ${targetInfo.label}"} (${modName})"
            def outputFile = file(".idea/runConfigurations/Upload_${modId.toUpperCase()}${targetInfo.suffix.isEmpty() ? "" : "_${targetInfo.suffix}"}.xml")

            outputs.file(outputFile)

            doLast {
                outputFile.parentFile.mkdirs()
                outputFile.text = """<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="${configName}" type="PythonConfigurationType" factoryName="Python" folderName="Upload">
    <module name="MultiLoader-AdvancedLootInfo"/>
    <option name="ENV_FILES" value=""/>
    <option name="INTERPRETER_OPTIONS" value=""/>
    <option name="PARENT_ENVS" value="true"/>
    <envs>
      <env name="PYTHONUNBUFFERED" value="1"/>
    </envs>
    <option name="SDK_HOME" value=""/>
    <option name="WORKING_DIRECTORY" value="\$PROJECT_DIR\$"/>
    <option name="IS_MODULE_SDK" value="true"/>
    <option name="ADD_CONTENT_ROOTS" value="true"/>
    <option name="ADD_SOURCE_ROOTS" value="true"/>
    <option name="SCRIPT_NAME" value="\$PROJECT_DIR\$/upload.py"/>
    <option name="PARAMETERS" value="${parameters}"/>
    <option name="SHOW_COMMAND_LINE" value="false"/>
    <option name="EMULATE_TERMINAL" value="false"/>
    <option name="MODULE_MODE" value="false"/>
    <option name="REDIRECT_INPUT" value="false"/>
    <option name="INPUT_FILE" value=""/>
    <method v="2"/>
  </configuration>
</component>
"""
                logger.lifecycle("Wrote ${outputFile}")
            }
        }
    }
}

tasks.register("generateUploadRunConfigs") {
    group = "ide"
    description = "Writes the IntelliJ Python run configurations for all upload targets"
    dependsOn uploadRunConfigTasks
}
