plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    gametest {
        java.srcDir project(":aci:common").file("src/gametest/java")
        resources.srcDir project(":aci:common").file("src/gametest/resources")
        java.srcDir project(":awi:common").file("src/gametest/java")
        resources.srcDir project(":awi:common").file("src/gametest/resources")
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = project(":awi:common").loom.accessWidenerPath

    neoForge {
        convertAccessWideners(tasks.named("shadowJar"), "awi.accesswidener")
    }

    mixin {
        defaultRefmapName = "awi.neoforge.refmap.json"
    }

    runs {
        data {
            clientData()
            programArgs "--all", "--mod", "${awi_mod_id}"
            programArgs "--output", "${file('src/main/generated/')}"
            programArgs "--existing", "${file("src/main/resources").absolutePath}"
        }
        gametest {
            environment "gametestserver"
            forgeTemplate "gameTestServer"
            name "Minecraft GameTest"
            source sourceSets.gametest
            programArgs "--tests", "${awi_mod_id}:*"
            property "awi.golden.dir", project.file("src/gametest/golden").absolutePath
            property "awi.golden.actual", project.file("build/gametest/golden").absolutePath
            property "awi.golden.regenerate", (project.findProperty("awi_golden_regenerate") ?: "false").toString()
            programArgs "--mixin.config", "aci.gametest.mixins.json"
            programArgs "--mixin.config", "awi.gametest.mixins.json"

            runDir "build/gametest/run"

            mods {
                main {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gametest
                }
            }
        }
    }
}

tasks.matching { it.name == "runGametest" }.configureEach {
    timeout = java.time.Duration.ofMinutes(10)

    doFirst {
        delete "build/gametest/run/config"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    common(project(path: ":aci:common")) { transitive false }
    runtimeOnly project(":aci:neoforge")

    project.ext.commonProjects.each { p ->
        common(project(path: p)) { transitive false }
        shadowCommon(project(path: p, configuration: "transformProductionNeoForge")) { transitive false }
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE")
}

sourcesJar {
    def commonSources = project(":awi:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
