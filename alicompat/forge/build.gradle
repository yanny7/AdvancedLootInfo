plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    gametest {
        java.srcDir project(":aci:common").file("src/gametest/java")
        java.srcDir project(":ali:common").file("src/gametest/java")
        java.srcDir project(":alicompat:common").file("src/gametest/java")
        java.exclude "com/yanny/ali/gametest/LootDataGolden.java"
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

def gametestMod = project.findProperty("alicompat_gametest")
def gametestModIds = ""

if (gametestMod) {
    def entry = new groovy.json.JsonSlurper().parse(rootProject.file("scripts/supported_mods.json")).find { it.key == gametestMod }
    def enabled = (project.findProperty("compat_mods") ?: "").split(",")*.trim().contains(gametestMod)

    if (entry && enabled && project.findProperty("${gametestMod}_${project.name}_dep")) {
        gametestModIds = entry.mod_ids.join(",")
    }
}

def gametestCoordinates = gametestModIds ? ["${gametestMod}_forge_dep", "${gametestMod}_forge_runtime_deps"].collectMany { (project.findProperty(it) ?: "").split(",")*.trim().findAll { it } } : []
def gametestNestedMods = null

// a Forge dev launch does not unpack jar-in-jar: jars using Minecraft go through loom to be remapped, the rest into mods/
def extractGametestNested = {
    if (gametestNestedMods != null) {
        return gametestNestedMods
    }

    gametestNestedMods = []

    def nestedDir = file("build/gametest/nested")
    def readJar = { byte[] bytes ->
        def input = new java.util.jar.JarInputStream(new ByteArrayInputStream(bytes))
        def entries = [:]

        for (def entry = input.nextJarEntry; entry != null; entry = input.nextJarEntry) {
            entries[entry.name] = input.readAllBytes()
        }

        input.close()
        [manifest: input.manifest ?: new java.util.jar.Manifest(), entries: entries]
    }
    def modIdOf = { Map entries ->
        def toml = entries["META-INF/mods.toml"]
        def match = toml ? new String(toml, "UTF-8") =~ /modId\s*=\s*"([^"]+)"/ : null

        match?.find() ? match.group(1) : null
    }
    def packagesOf = { Collection<String> names -> names.findAll { it.endsWith(".class") && it.contains("/") }.collect { it.substring(0, it.lastIndexOf("/")) } as Set }
    def providedArtifacts = configurations.minecraftLibraries.resolvedConfiguration.resolvedArtifacts.collect { it.name } as Set
    def providedPackages = configurations.minecraftLibraries.resolve().collectMany { jar ->
        def zip = new java.util.zip.ZipFile(jar)
        def packages = packagesOf(zip.entries().collect { it.name })

        zip.close()
        packages
    } as Set
    def outerJars = configurations.detachedConfiguration(*gametestCoordinates.collect { dependencies.create(it) }).tap { transitive = false }.resolve()
    def provided = outerJars.collect { modIdOf(readJar(it.bytes).entries) }.findAll { it } as Set

    nestedDir.deleteDir()
    new File(nestedDir, "mods").mkdirs()
    new File(nestedDir, "libs").mkdirs()

    outerJars.each { jar ->
        def outer = new java.util.zip.ZipFile(jar)

        outer.entries().findAll { it.name ==~ /META-INF\/(jars|jarjar)\/[^\/]+\.jar/ }.each { nested ->
            def name = nested.name.substring(nested.name.lastIndexOf("/") + 1)
            def bytes = outer.getInputStream(nested).readAllBytes()
            def content = readJar(bytes)
            def modId = modIdOf(content.entries)

            def referencesMinecraft = content.entries.any { entryName, data -> entryName.endsWith(".class") && new String(data, "ISO-8859-1").contains("net/minecraft/") }

            def providedLibrary = providedArtifacts.any { name.startsWith("$it-") } || packagesOf(content.entries.keySet()).any { providedPackages.contains(it) }

            if (!modId && !referencesMinecraft && providedLibrary) {
                return
            }

            if (referencesMinecraft) {
                if (!modId || provided.add(modId)) {
                    def target = new File(nestedDir, "mods/$name")

                    target.bytes = bytes
                    gametestNestedMods << target
                }
            } else if (!modId || provided.add(modId)) {
                def manifest = content.manifest

                if (!modId && !manifest.mainAttributes.getValue("FMLModType")) {
                    manifest.mainAttributes.putValue("Manifest-Version", "1.0")
                    manifest.mainAttributes.putValue("FMLModType", "GAMELIBRARY")
                }

                def output = new java.util.jar.JarOutputStream(new FileOutputStream(new File(nestedDir, "libs/$name")), manifest)

                content.entries.each { entryName, data ->
                    output.putNextEntry(new java.util.jar.JarEntry(entryName))
                    output.write(data)
                    output.closeEntry()
                }

                output.close()
            }
        }

        outer.close()
    }

    return gametestNestedMods
}

loom {
    accessWidenerPath = project(":ali:common").loom.accessWidenerPath
    createRemapConfigurations(sourceSets.gametest)

    runs {
        data {
            data()
            programArgs "--all", "--mod", "${alicompat_mod_id}"
            programArgs "--output", "${file('src/main/generated/')}"
            programArgs "--existing", "${file("src/main/resources").absolutePath}"
        }
        gametest {
            environment "gametestserver"
            forgeTemplate "gameTestServer"
            name "Minecraft GameTest"
            source sourceSets.gametest
            property "forge.enabledGameTestNamespaces", alicompat_mod_id
            property "alicompat.golden.dir", project.file("src/gametest/golden").absolutePath
            property "alicompat.golden.actual", project.file("build/gametest/golden").absolutePath
            property "alicompat.golden.regenerate", (project.findProperty("alicompat_golden_regenerate") ?: "false").toString()
            property "alicompat.gametest.mod", (gametestMod ?: "base").toString()
            property "alicompat.gametest.modids", gametestModIds

            runDir "build/gametest/run"

            mods {
                main {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gametest
                }
            }
        }
    }
}

tasks.matching { it.name == "runGametest" }.configureEach {
    timeout = java.time.Duration.ofMinutes(10)

    doFirst {
        if (gametestMod && !gametestModIds) {
            throw new GradleException("alicompat_gametest=${gametestMod} is not a mod enabled in compat_mods with a ${project.name} dependency")
        }

        delete "build/gametest/run/config", "build/gametest/run/world", "build/gametest/run/mods"
        extractGametestNested()
        copy {
            from "build/gametest/nested/libs"
            into "build/gametest/run/mods"
        }
    }
}

evaluationDependsOn(":ali:forge")

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    common(project(path: ":aci:common", configuration: "namedElements")) { transitive false }
    common(project(path: ":ali:common", configuration: "namedElements")) { transitive false }
    runtimeOnly project(path: ":aci:forge", configuration: "namedElements")
    runtimeOnly project(path: ":ali:forge", configuration: "namedElements")
    gametestCompileOnly project(path: ":ali:forge", configuration: "namedElements")

    gametestCoordinates.each { modGametestRuntimeOnly it }
    if (gametestCoordinates) {
        modGametestRuntimeOnly files({ extractGametestNested() })
    }
    rootProject.project(":ali:forge").ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
    }

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    // MoreJS' trade classes extend KubeJS types no shim imports, so nothing else pulls KubeJS in and they fail to load
    modCompileOnly "curse.maven:kubejs-238086:5853326"

    project.ext.commonProjects.each { p ->
        common(project(path: p, configuration: "namedElements")) { transitive false }
        shadowCommon(project(path: p, configuration: "transformProductionForge")) { transitive false }
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":alicompat:common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
